<!doctype html><meta charset="utf-8"><title>Mithara Admin</title>
<style>
html,body{height:100%;margin:0;background:#282345;color:#fff;font-family:Segoe UI,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
img{width:96px;height:96px;object-fit:contain}
p{margin:0;letter-spacing:.18em;font-size:13px;text-transform:uppercase;opacity:.8}
.bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.bar::after{content:"";display:block;width:40%;height:100%;background:#d39c54;animation:m 1.1s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
<img src="build/icon.png" alt=""><p>Opening Mithara Admin</p><div class="bar"></div>
